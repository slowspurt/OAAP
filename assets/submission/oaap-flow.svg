<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">OAAP: purpose, download outcome, and a feedback request</title>
  <desc id="desc">Concept illustration, not a screenshot or test result. A participating AI preserves an ordinary final access prompt or anonymizes proprietary ideas before sending. The required prompt goes directly to maintainer-owned Apps Script and Sheets. Access starts pending; a separate observed download result becomes succeeded or failed. After observed use, the AI relays a feedback request. No user response or feedback collection is demonstrated.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#466778" stroke-width="1.8"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #172f3f; }
      .eyebrow { font-size: 17px; font-weight: 700; letter-spacing: 1.8px; }
      .heading { font-size: 44px; font-weight: 750; }
      .sub { font-size: 23px; fill: #466172; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .note { font-size: 18px; fill: #466172; }
      .small { font-size: 16px; fill: #466172; }
      .line { fill: none; stroke: #466778; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="940" fill="#f5f8fa"/>
  <text x="60" y="55" class="eyebrow">OAAP / PRONOUNCED “OH-APP”</text>
  <rect x="966" y="28" width="414" height="40" rx="20" fill="#e2ebf0"/>
  <text x="1173" y="54" text-anchor="middle" class="small">CONCEPT ILLUSTRATION · NOT TEST EVIDENCE</text>
  <text x="60" y="121" class="heading">Understand why AI accesses open source.</text>
  <text x="60" y="164" class="sub">Maintainer-owned records. A required prompt. An observed download outcome.</text>
  <rect x="60" y="208" width="1320" height="58" rx="12" fill="#e6eff1"/>
  <text x="84" y="244" class="body">ENTRY: “Human or AI?”   Humans continue without an AI prompt. AI participation is self-declared.</text>

  <rect x="60" y="302" width="418" height="330" rx="18" fill="#fff" stroke="#cad8df"/>
  <text x="86" y="342" class="eyebrow">1 / PREPARE BEFORE SENDING</text>
  <text x="86" y="388" class="label">AI prepares the final access prompt</text>
  <text x="86" y="427" class="body">Ordinary task → preserve wording</text>
  <text x="86" y="465" class="body">Proprietary idea → anonymize details</text>
  <text x="86" y="503" class="body">Keep a meaningful account of the work.</text>
  <line x1="86" y1="530" x2="450" y2="530" stroke="#dce5ea"/>
  <text x="86" y="561" class="note">Final prompt required; category is extra.</text>
  <text x="86" y="590" class="note">Use applicable data-sharing permission.</text>
  <text x="86" y="615" class="small">No secrets, full transcripts, or hidden reasoning.</text>

  <path d="M482 466 H547" class="line"/>
  <text x="516" y="441" text-anchor="middle" class="small">access</text>

  <rect x="555" y="302" width="825" height="330" rx="18" fill="#eaf4ef" stroke="#aecbbb"/>
  <text x="583" y="342" class="eyebrow">2 / MAINTAINER-OWNED RECEIVER + SHEET</text>
  <text x="583" y="385" class="label">Apps Script → Google Sheets</text>
  <text x="583" y="418" class="note">Direct to the maintainer. No central OAAP server or hosted dashboard.</text>
  <rect x="586" y="451" width="197" height="92" rx="12" fill="#fff" stroke="#bacfc3"/>
  <text x="684" y="487" text-anchor="middle" class="label">pending</text>
  <text x="684" y="519" text-anchor="middle" class="small">prompt receipt accepted</text>
  <path d="M796 496 H1063" class="line"/>
  <text x="931" y="476" text-anchor="middle" class="small">separate result update</text>
  <text x="931" y="528" text-anchor="middle" class="small">after observed download</text>
  <rect x="1076" y="451" width="272" height="92" rx="12" fill="#fff" stroke="#bacfc3"/>
  <text x="1212" y="487" text-anchor="middle" class="label">succeeded / failed</text>
  <text x="1212" y="519" text-anchor="middle" class="small">agent-reported outcome</text>
  <text x="584" y="586" class="body">Receipt ≠ download success.</text>
  <text x="584" y="615" class="note">Same-event retries keep one committed record in the intended contract.</text>

  <rect x="60" y="664" width="1320" height="167" rx="18" fill="#fff" stroke="#cad8df"/>
  <text x="86" y="704" class="eyebrow">3 / AFTER OBSERVED USE</text>
  <text x="86" y="744" class="label">AI relays the maintainer’s usage-feedback request → user</text>
  <text x="86" y="778" class="body">Request delivered ≠ user response ≠ feedback received by the maintainer.</text>
  <text x="86" y="808" class="note">The v0.1 receiver does not store feedback responses. Star-request value is under review.</text>

  <text x="60" y="873" class="note">Explains the protocol; does not demonstrate execution, customer adoption, or anonymization accuracy.</text>
  <text x="60" y="907" class="note">Repository guidance does not intercept every clone/ZIP download or guarantee pre-download discovery.</text>
</svg>
